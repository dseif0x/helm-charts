baseDomain: dl.homelab.seifert.id

# VPN sidecar for both download clients. Upstream's `latest` is a dev build
# with no matching release tag, so this pins the build that has been running.
gluetun:
  image: qmcgaw/gluetun@sha256:2733bb22b27e3efa7a9f2cef9057ec12791b8b225793fcd3dbfd0508404dfc25

deluge:
  config:
    # PVC to mount instead of the chart's deluge-config-pvc, e.g. a copy on
    # another StorageClass made by migrate-pvc-to-longhorn.sh.
    existingClaim: ""
    # Create deluge-config-pvc (nfs-fast). Keep it while it's the rollback copy.
    createClaim: true
  image: linuxserver/deluge:latest
  affinity: {}
  nodeSelector: {}
  resources:
    requests:
      memory: "131Mi"
      cpu: "100m"
    limits:
      memory: "200Mi"

sabnzbd:
  config:
    # PVC to mount instead of the chart's sabnzbd-config-pvc, e.g. a copy on another
    # StorageClass made by migrate-pvc-to-longhorn.sh.
    existingClaim: ""
    # Create sabnzbd-config-pvc (nfs-fast). Keep it while it's the rollback copy.
    createClaim: true
  image: lscr.io/linuxserver/sabnzbd:5.1.3-ls279
  # par2/unrar are CPU heavy: keep it on x86.
  affinity: {}
  nodeSelector:
    kubernetes.io/arch: amd64
  resources:
    requests:
      memory: "131Mi"
      cpu: "100m"
    limits:
      memory: "2000Mi"

extraResources:
