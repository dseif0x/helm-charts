baseDomain: dl.homelab.seifert.id

# VPN sidecar for both download clients. Upstream's `latest` is a dev build
# with no matching release tag, so this pins the build that has been running.
gluetun:
  image: qmcgaw/gluetun@sha256:2733bb22b27e3efa7a9f2cef9057ec12791b8b225793fcd3dbfd0508404dfc25

deluge:
  image: linuxserver/deluge:latest
  nodeSelector: {}

sabnzbd:
  image: lscr.io/linuxserver/sabnzbd:5.1.3-ls275
  # par2/unrar are CPU heavy: keep it on x86.
  nodeSelector:
    kubernetes.io/arch: amd64

extraResources:
