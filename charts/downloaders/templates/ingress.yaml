apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  # No secretName: Traefik serves its default certificate, the
  # *.homelab.seifert.id wildcard (flux-gitops-repo controllers/homelab-tls),
  # so the host name doesn't end up in the public CT logs.
  tls:
    - hosts:
        - sabnzbd.{{ .Values.baseDomain }}
        - deluge.{{ .Values.baseDomain }}
  rules:
    - host: sabnzbd.{{ .Values.baseDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sabnzbd
                port:
                  name: http
    - host: deluge.{{ .Values.baseDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deluge
                port:
                  name: http
