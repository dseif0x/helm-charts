{{- if .Values.data.createClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synapse-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-fast
  resources:
    requests:
      storage: 1Gi
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: synapse
  template:
    metadata:
      labels:
        app: synapse
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Run as the synapse user directly instead of letting the entrypoint
      # start as root and drop privileges (the image supports `--user`; /data
      # is owned by 991). Satisfies the Pod Security `restricted` profile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        runAsGroup: 991
        fsGroup: 991
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.database.postgres.secretName }}
      # Writes the database section from the CloudNativePG app Secret into
      # its own config file, so the password stays out of homeserver.yaml
      # and Git. Synapse merges --config-path files; later ones win.
      initContainers:
        - name: database-config
          image: {{ $.Values.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - python
            - -c
            - |
              import json, os
              args = {k: os.environ[e] for k, e in (("user", "PGUSER"), ("password", "PGPASSWORD"), ("dbname", "PGDATABASE"), ("host", "PGHOST"))}
              args.update(port=int(os.environ["PGPORT"]), cp_min=5, cp_max=10)
              with open("/db-config/database.yaml", "w") as f:
                  json.dump({"database": {"name": "psycopg2", "args": args}}, f)
          env:
            {{- range $var, $key := dict "PGUSER" "username" "PGPASSWORD" "password" "PGDATABASE" "dbname" "PGHOST" "host" "PGPORT" "port" }}
            - name: {{ $var }}
              valueFrom:
                secretKeyRef: {name: {{ $.Values.database.postgres.secretName }}, key: {{ $key }}}
            {{- end }}
          volumeMounts:
            - name: db-config
              mountPath: /db-config
      {{- end }}
      containers:
        - name: synapse
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          {{- if .Values.database.postgres.secretName }}
          # Same as the image's start.py in run mode (already non-root), plus
          # the generated database config.
          command:
            - python
            - -m
            - synapse.app.homeserver
            - --config-path
            - /data/homeserver.yaml
            - --config-path
            - /db-config/database.yaml
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: {path: /health, port: 8008}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8008}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # Up to 5 min for the first start (migrations / loading)
          # before liveness takes over.
          startupProbe:
            httpGet: {path: /health, port: 8008}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: synapse-storage
              mountPath: /data
            {{- if .Values.database.postgres.secretName }}
            - name: db-config
              mountPath: /db-config
              readOnly: true
            {{- end }}
          ports:
            - containerPort: 8008
              name: http
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: synapse-storage
          persistentVolumeClaim:
            claimName: {{ .Values.data.existingClaim | default "synapse-data" }}
        {{- if .Values.database.postgres.secretName }}
        - name: db-config
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: synapse
spec:
  type: ClusterIP
  selector:
    app: synapse
  ports:
    - name: http
      port: 8008
      targetPort: 8008
