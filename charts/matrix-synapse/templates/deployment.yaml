---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synapse-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-fast
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: synapse
  template:
    metadata:
      labels:
        app: synapse
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Run as the synapse user directly instead of letting the entrypoint
      # start as root and drop privileges (the image supports `--user`; /data
      # is owned by 991). Satisfies the Pod Security `restricted` profile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        runAsGroup: 991
        fsGroup: 991
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: synapse
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: {path: /health, port: 8008}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8008}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # Up to 5 min for the first start (migrations / loading)
          # before liveness takes over.
          startupProbe:
            httpGet: {path: /health, port: 8008}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: synapse-storage
              mountPath: /data
          ports:
            - containerPort: 8008
              name: http
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: synapse-storage
          persistentVolumeClaim:
            claimName: synapse-data
---
apiVersion: v1
kind: Service
metadata:
  name: synapse
spec:
  type: ClusterIP
  selector:
    app: synapse
  ports:
    - name: http
      port: 8008
      targetPort: 8008
