domain: matrix.homelab.seifert.id

# Synapse runs DB migrations on upgrade: bump deliberately.
image: matrixdotorg/synapse:v1.164.1

resources:
  requests:
    memory: "200Mi"
    cpu: "100m"
  limits:
    memory: "1000Mi"

# Latency-sensitive: keep off the Orange Pis.
nodeSelector:
  kubernetes.io/arch: amd64
data:
  # PVC to mount instead of the chart's synapse-data, e.g. a copy on another
  # StorageClass made by migrate-pvc-to-longhorn.sh.
  existingClaim: ""
  # Create synapse-data (nfs-fast). Keep it while it's the rollback copy.
  createClaim: true

database:
  postgres:
    # Name of a CloudNativePG app Secret (keys username, password, dbname,
    # host, port). When set, Synapse uses that PostgreSQL database instead of
    # the database section in /data/homeserver.yaml (SQLite). Port existing
    # data first with synapse_port_db.
    secretName: ""
