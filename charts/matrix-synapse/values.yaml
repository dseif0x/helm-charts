domain: matrix.homelab.seifert.id
# Extra hostnames (e.g. public ones via the Cloudflare tunnel); rules only, no TLS.
publicHosts: []

# Synapse runs DB migrations on upgrade: bump deliberately.
image: matrixdotorg/synapse:v1.162.0

resources:
  requests:
    memory: "200Mi"
    cpu: "100m"
  limits:
    memory: "1000Mi"

# Latency-sensitive: keep off the Orange Pis.
nodeSelector:
  kubernetes.io/arch: amd64
