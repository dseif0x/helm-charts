apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-ups-monitor
  labels:
    app: k8s-ups-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-ups-monitor
  template:
    metadata:
      labels:
        app: k8s-ups-monitor
    spec:
      {{- with .Values.monitor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: k8s-ups-monitor
        image: {{ .Values.monitor.image }}
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: k8s-ups-monitor-config
        - secretRef:
            name: mqtt-config-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      restartPolicy: Always