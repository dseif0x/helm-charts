extraResources:

image: cloudflare/cloudflared:2026.10.0

# Uses ~20Mi per pod.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# Transport to the Cloudflare edge: "" = cloudflared default (quic, falls back
# to http2), "http2" or "quic". QUIC (UDP) can deliver far less than the
# uplink allows on some connections; http2 (TCP) is the usual fix.
protocol: ""
