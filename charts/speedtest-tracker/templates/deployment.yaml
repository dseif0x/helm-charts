# speedtest-tracker_deployment.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: speedtest-tracker-config-pvc}
spec:
  storageClassName: nfs-fast
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: speedtest-tracker}
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels: {app: speedtest-tracker}
  template:
    metadata:
      labels: {app: speedtest-tracker}
    spec:
      securityContext: 
        fsGroup: 1000
      containers:
        - name: speedtest-tracker
          image: {{ .Values.image }}
          readinessProbe:
            httpGet: {path: /api/healthcheck, port: 80}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/healthcheck, port: 80}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # Up to 5 min for the first start (migrations / loading)
          # before liveness takes over.
          startupProbe:
            httpGet: {path: /api/healthcheck, port: 80}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          env:
            - {name: APP_TIMEZONE,  value: "Europe/Vienna"}
            - {name: TZ,            value: "Europe/Vienna"}
            - {name: PUID,          value: "1000"}
            - {name: PGID,          value: "1000"}
            - {name: DB_CONNECTION, value: "sqlite"}
            # Laravel app key (encrypts sessions and stored settings).
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "appKeySecret.name is required" .Values.appKeySecret.name }}
                  key: {{ .Values.appKeySecret.key }}
            - {name: SPEEDTEST_SCHEDULE, value: "0 0,12 * * *"}
          ports:
            - {containerPort: 80}
          volumeMounts:
            - {name: config, mountPath: /config}
          resources:
            requests:
              memory: "262Mi"
              cpu: "100m"
            limits:
              memory: "408Mi"
      volumes:
        - {name: config, persistentVolumeClaim: {claimName: speedtest-tracker-config-pvc}}
---
apiVersion: v1
kind: Service
metadata: {name: speedtest-tracker}
spec:
  selector: {app: speedtest-tracker}
  ports:
    - {port: 80, targetPort: 80, name: http}
  type: ClusterIP
