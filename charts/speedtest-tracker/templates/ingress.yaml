apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-speedtest-tracker-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  # No secretName: Traefik serves its default certificate, the
  # *.homelab.seifert.id wildcard (flux-gitops-repo controllers/homelab-tls),
  # so the host name doesn't end up in the public CT logs.
  tls:
    - hosts:
        - "{{ .Values.domain }}"
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: speedtest-tracker
                port:
                  name: http
