domain: chart-example.local
image: lscr.io/linuxserver/speedtest-tracker:1.15.0

# Secret holding the Laravel APP_KEY ("base64:<32 random bytes, base64>"),
# e.g. from: echo "base64:$(openssl rand -base64 32)"
appKeySecret:
  name: ""
  key: APP_KEY
config:
  # PVC to mount instead of the chart's speedtest-tracker-config-pvc, e.g. a copy on another
  # StorageClass made by migrate-pvc-to-longhorn.sh.
  existingClaim: ""
  # Create speedtest-tracker-config-pvc (nfs-fast). Keep it while it's the rollback copy.
  createClaim: true
