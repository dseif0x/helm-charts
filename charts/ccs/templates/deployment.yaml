apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ccs
  template:
    metadata:
      labels:
        app: ccs
    spec:
      containers:
      - image: {{ .Values.image }}
        imagePullPolicy: Always
        name: ccs
        ports:
        - containerPort: 3000
          protocol: TCP
          name: http
        - containerPort: 8317
          protocol: TCP
          name: cliproxy
        env:
        - name: CCS_PORT
          value: "3000"
        volumeMounts:
        - name: ccs-storage
          mountPath: /root/.ccs
        - name: ccs-logs
          mountPath: /var/log/ccs
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
        - name: ccs-storage
          persistentVolumeClaim:
            claimName: ccs-data
        - name: ccs-logs
          emptyDir: {}
---
kind: Service
apiVersion: v1
metadata:
  name: ccs-svc
spec:
  type: ClusterIP
  selector:
    app: ccs
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 3000
  - name: cliproxy
    port: 8317
    protocol: TCP
    targetPort: 8317
