domain: z2m.homelab.seifert.id
image: koenkk/zigbee2mqtt:2.6

# Zigbee coordinator. The device is allocated by generic-device-plugin
# (extended resource below) instead of a privileged hostPath mount.
serial:
  deviceResource: devic.es/zigbee
  port: /dev/ttyUSB0
  adapter: zstack       # Z-Stack 3.x0 coordinator (auto-detected before)

# Uses ~100Mi.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

data:
  # PVC to mount at /app/data instead of the chart's zigbee2mqtt-data, e.g. a
  # copy on another StorageClass made by migrate-pvc-to-longhorn.sh.
  existingClaim: ""
  # Create zigbee2mqtt-data (nfs-fast). Keep it while it's the rollback copy.
  createClaim: true
