domain: z2m.homelab.seifert.id
image: koenkk/zigbee2mqtt:2.6

# Zigbee coordinator. The device is allocated by generic-device-plugin
# (extended resource below) instead of a privileged hostPath mount.
serial:
  deviceResource: devic.es/zigbee
  port: /dev/ttyUSB0
  adapter: zstack       # Z-Stack 3.x0 coordinator (auto-detected before)
  # Network bridge for the coordinator: a small socat pod on the coordinator's
  # node (zigbee taint, device resource) serves the stick on TCP, and
  # zigbee2mqtt connects to it as serial.port tcp://<release>-bridge:<port>.
  # zigbee2mqtt itself then has no node binding (no device, nodeSelector or
  # toleration), so its data can live on any StorageClass (e.g. Longhorn).
  bridge:
    enabled: false
    image: alpine/socat:1.8.1.3@sha256:71131702f671a88b3808a70b7330f9679cd9b9933adcafadc191508edfe55bba
    port: 6638
    baudrate: 115200    # Z-Stack default (CC2652P sticks)

# Where the pod that holds the coordinator runs (zigbee2mqtt itself, or the
# bridge when serial.bridge.enabled).
coordinatorNode:
  nodeSelector:
    zigbee: "true"
  tolerations:
    - key: "zigbee"
      operator: "Equal"
      value: "only"
      effect: "NoSchedule"

# Uses ~100Mi.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

data:
  # PVC to mount at /app/data instead of the chart's zigbee2mqtt-data, e.g. a
  # copy on another StorageClass made by migrate-pvc-to-longhorn.sh.
  existingClaim: ""
  # Create zigbee2mqtt-data (nfs-fast). Keep it while it's the rollback copy.
  createClaim: true
