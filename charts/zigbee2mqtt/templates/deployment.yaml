---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zigbee2mqtt-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
  storageClassName: nfs-fast
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  labels:
    app: zigbee2mqtt
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: zigbee2mqtt
  template:
    metadata:
      labels:
        app: zigbee2mqtt
    spec:
      nodeSelector:
        zigbee: "true"
      tolerations:
        - key: "zigbee"
          operator: "Equal"
          value: "only"
          effect: "NoSchedule"
      containers:
        - name: zigbee2mqtt
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          # No privileged mode or hostPath: the coordinator is allocated by
          # generic-device-plugin (resource below) and appears as
          # serial.port in the container.
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              {{ .Values.serial.deviceResource }}: 1
          env:
            - name: TZ
              value: Europe/Berlin
            # Set explicitly: without /run/udev, adapter auto-detection has
            # nothing to go on.
            - name: ZIGBEE2MQTT_CONFIG_SERIAL_PORT
              value: {{ .Values.serial.port | quote }}
            - name: ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER
              value: {{ .Values.serial.adapter | quote }}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # Coordinator start-up and network restore can take a while.
          startupProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /app/data
          ports:
            - containerPort: 8080
              name: http
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data

---
apiVersion: v1
kind: Service
metadata:
  name: zigbee2mqtt
  labels:
    app: zigbee2mqtt
spec:
  selector:
    app: zigbee2mqtt
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      name: http
  type: ClusterIP
