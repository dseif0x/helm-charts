# apple-music-downloader
# https://github.com/zhaarey/apple-music-downloader
# NOTE: the upstream image is a CLI. Swap `mdl.image` for an HTTP server image
# when ready - the NFS download mount and wrapper wiring stay the same.
mdl:
  image: ghcr.io/zhaarey/apple-music-downloader:latest
  imagePullPolicy: Always
  # Port the (future) HTTP server listens on inside the container.
  port: 8080
  # Where downloads are written inside the container.
  mountPath: /downloads
  # The upstream image is published for linux/amd64 only, so pin scheduling to
  # amd64 nodes. Override/clear this only if an arm64 image becomes available.
  nodeSelector:
    kubernetes.io/arch: amd64
  # NFS share holding the downloaded music.
  nfs:
    server: cp0.seifert.id
    path: /mnt/hdd_huge/
    subPath: applemusic
    readOnly: false
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1000m"
  # Rendered verbatim to /app/config.yaml inside the container. The
  # `decrypt-m3u8-port` / `get-m3u8-port` keys are wired to the wrapper service
  # automatically (see mdl-configmap.yaml), so don't set them here. All other
  # upstream config.yaml options can be added/overridden below.
  # https://github.com/zhaarey/apple-music-downloader/blob/main/config.yaml
  config:
    media-user-token: ""
    authorization-token: ""
    language: ""
    lrc-type: lyrics
    lrc-format: ttml
    embed-lrc: true
    save-lrc-file: false
    save-artist-cover: false
    save-animated-artwork: false
    emby-animated-artwork: false
    embed-cover: true
    cover-size: 5000x5000
    cover-format: jpg
    alac-save-folder: AM-DL downloads
    atmos-save-folder: AM-DL-Atmos downloads
    aac-save-folder: AM-DL-AAC downloads
    max-memory-limit: 256
    get-m3u8-from-device: true
    get-m3u8-mode: hires
    aac-type: aac-lc
    alac-max: 192000
    atmos-max: 2768
    limit-max: 200
    use-songinfo-for-playlist: false
    dl-albumcover-for-playlist: false
    mv-audio-type: atmos
    mv-max: 2160
    storefront: ""

# wrapper (decryption dependency)
# https://github.com/WorldObservationLog/wrapper
wrapper:
  image: ghcr.io/worldobservationlog/wrapper:local
  imagePullPolicy: Always
  # Passed to the wrapper via the `args` env var. Bind to all interfaces so the
  # downloader pod can reach the decrypt/m3u8/account services.
  args: "-H 0.0.0.0"
  # The wrapper emulates an Android device and is published for linux/amd64
  # only, so pin scheduling to amd64 nodes. Override/clear only if an arm64
  # image becomes available.
  nodeSelector:
    kubernetes.io/arch: amd64
  # Service ports exposed by the wrapper.
  decryptPort: 10020
  m3u8Port: 20020
  accountPort: 30020
  # The wrapper emulates an Android device and needs a privileged container.
  privileged: true
  # Persistent storage for /app/rootfs/data (login state / device data).
  storage:
    size: 2Gi
    storageClassName: nfs-fast
    accessMode: ReadWriteOnce
    mountPath: /app/rootfs/data
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "2000m"
