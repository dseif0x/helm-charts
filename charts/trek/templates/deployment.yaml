apiVersion: apps/v1
kind: Deployment
metadata:
  name: trek
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trek
  template:
    metadata:
      labels:
        app: trek
    spec:
      containers:
      - image: {{ .Values.image }}
        imagePullPolicy: Always
        name: trek
        ports:
        - containerPort: 3000
          protocol: TCP
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        volumeMounts:
        - name: trek-storage
          mountPath: /app/data
        - name: trek-storage-upload
          mountPath: /app/uploads
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
        - name: trek-storage
          persistentVolumeClaim:
            claimName: trek-data
        - name: trek-storage-upload
          persistentVolumeClaim:
            claimName: trek-data-upload
---
kind: Service
apiVersion: v1
metadata:
  name: trek-svc
spec:
  type: ClusterIP
  selector:
    app: trek
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 3000