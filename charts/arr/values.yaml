  nodeSelector:
    kubernetes.io/arch: amd64
  resources:
    requests:
      memory: "410Mi"
      cpu: "100m"
    limits:
      memory: "744Mi"

prowlarr:
  postgres:
    # CloudNativePG app Secret (keys host, port, username, password). When
    # set, prowlarr uses PostgreSQL databases mainDb/logDb instead of SQLite.
    secretName: ""
