baseDomain: arr.homelab.seifert.id

jellyfin:
  config:
    # PVC to mount at /config instead of the chart's jellyfin-config-pvc, e.g. a
    # copy on another StorageClass made by migrate-pvc-to-longhorn.sh.
    existingClaim: ""
    # Create jellyfin-config-pvc (nfs-fast). Keep it while it's the rollback copy.
    createClaim: true
  image: jellyfin/jellyfin:12.2
  # Run `--mode MigrateSystem` in an init container before the server.
  # Needs Jellyfin >= 12 (the flag doesn't exist before).
  migrateOnStart: true
  affinity: {}
  nodeSelector: {}
  resources:
    requests:
      memory: "1000Mi"
      cpu: "100m"
    limits:
      memory: "10000Mi"
      cpu: "8000m"
      amd.com/gpu: 1

overseerr:
  config:
    # PVC to mount at /config instead of the chart's overseerr-config-pvc, e.g. a
    # copy on another StorageClass made by migrate-pvc-to-longhorn.sh.
    existingClaim: ""
    # Create overseerr-config-pvc (nfs-fast). Keep it while it's the rollback copy.
    createClaim: true
  image: fallenbagel/jellyseerr:latest
  # Latency-sensitive web app: slow on the Orange Pis (A55 cores + SQLite over NFS).
  affinity: {}
  nodeSelector:
    kubernetes.io/arch: amd64
  resources:
    requests:
      memory: "351Mi"
      cpu: "100m"
    limits:
      memory: "1000Mi"
      cpu: "2000m"

flaresolverr:
  image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
  # Latency-sensitive web app: slow on the Orange Pis (A55 cores + SQLite over NFS).
