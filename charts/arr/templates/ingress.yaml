apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  # No secretName: Traefik serves its default certificate, the
  # *.homelab.seifert.id wildcard (flux-gitops-repo controllers/homelab-tls),
  # so the host name doesn't end up in the public CT logs.
  tls:
    - hosts:
        - jellyfin.{{ .Values.baseDomain }}
        - seerr.{{ .Values.baseDomain }}
        - prowlarr.{{ .Values.baseDomain }}
        - radarr.{{ .Values.baseDomain }}
        - sonarr.{{ .Values.baseDomain }}
  rules:
    - host: jellyfin.{{ .Values.baseDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  name: http
    - host: seerr.{{ .Values.baseDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: overseerr
                port:
                  name: http
    - host: prowlarr.{{ .Values.baseDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr
                port:
                  name: http
    - host: radarr.{{ .Values.baseDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  name: http
    - host: sonarr.{{ .Values.baseDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr
                port:
                  name: http
