# prowlarr_deployment.yaml
{{- if .Values.prowlarr.config.createClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: prowlarr-config-pvc}
spec: 
  storageClassName: nfs-fast
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 3Gi}}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prowlarr}
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector: {matchLabels: {app: prowlarr}}
  template:
    metadata: {labels: {app: prowlarr}}
    spec:
      {{- with .Values.prowlarr.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.prowlarr.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: prowlarr
          image: {{ .Values.prowlarr.image }}
          imagePullPolicy: IfNotPresent
          readinessProbe:
            httpGet: {path: /ping, port: 9696}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /ping, port: 9696}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # Up to 5 min for the first start (migrations / loading)
          # before liveness takes over.
          startupProbe:
            httpGet: {path: /ping, port: 9696}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ,   value: "Europe/Vienna"}
            {{- with .Values.prowlarr.postgres }}
            {{- if .secretName }}
            # PostgreSQL instead of SQLite (Servarr env overrides for config.xml).
            - {name: PROWLARR__POSTGRES__HOST, valueFrom: {secretKeyRef: {name: {{ .secretName }}, key: host}}}
            - {name: PROWLARR__POSTGRES__PORT, valueFrom: {secretKeyRef: {name: {{ .secretName }}, key: port}}}
            - {name: PROWLARR__POSTGRES__USER, valueFrom: {secretKeyRef: {name: {{ .secretName }}, key: username}}}
            - {name: PROWLARR__POSTGRES__PASSWORD, valueFrom: {secretKeyRef: {name: {{ .secretName }}, key: password}}}
            - {name: PROWLARR__POSTGRES__MAINDB, value: {{ .mainDb | default "prowlarr-main" | quote }}}
            - {name: PROWLARR__POSTGRES__LOGDB, value: {{ .logDb | default "prowlarr-log" | quote }}}
            {{- end }}
            {{- end }}
          ports: [{containerPort: 9696}]
          volumeMounts:
            - {name: config, mountPath: /config}
          resources:
            {{- toYaml .Values.prowlarr.resources | nindent 12 }}
      volumes:
        - {name: config, persistentVolumeClaim: {claimName: {{ .Values.prowlarr.config.existingClaim | default "prowlarr-config-pvc" }}}}
---
apiVersion: v1
kind: Service
metadata: {name: prowlarr}
spec:
  selector: {app: prowlarr}
  ports: [{port: 9696, targetPort: 9696, name: http}]
  type: ClusterIP
