# overseerr_deployment.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: overseerr-config-pvc}
spec: 
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 3Gi}}
  storageClassName: nfs-fast
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: overseerr}
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector: {matchLabels: {app: overseerr}}
  template:
    metadata: {labels: {app: overseerr}}
    spec:
      {{- with .Values.overseerr.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: overseerr
          image: {{ .Values.overseerr.image }}
          imagePullPolicy: IfNotPresent
          readinessProbe:
            httpGet: {path: /api/v1/status, port: 5055}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/v1/status, port: 5055}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # Up to 5 min for the first start (migrations / loading)
          # before liveness takes over.
          startupProbe:
            httpGet: {path: /api/v1/status, port: 5055}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ,   value: "Europe/Vienna"}
          ports: [{containerPort: 5055}]
          volumeMounts:
            - {name: config, mountPath: /app/config}
          resources:
            {{- toYaml .Values.overseerr.resources | nindent 12 }}
      volumes:
        - {name: config, persistentVolumeClaim: {claimName: overseerr-config-pvc}}
---
apiVersion: v1
kind: Service
metadata: {name: overseerr}
spec:
  selector: {app: overseerr}
  ports: [{port: 5055, targetPort: 5055, name: http}]
  type: ClusterIP
