# radarr_deployment.yaml
{{- if .Values.radarr.config.createClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: radarr-config-pvc}
spec: 
  storageClassName: nfs-fast
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 4Gi}}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: radarr}
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector: {matchLabels: {app: radarr}}
  template:
    metadata: {labels: {app: radarr}}
    spec:
      {{- with .Values.radarr.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.radarr.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: radarr
          image: {{ .Values.radarr.image }}
          imagePullPolicy: IfNotPresent
          readinessProbe:
            httpGet: {path: /ping, port: 7878}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /ping, port: 7878}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # Up to 5 min for the first start (migrations / loading)
          # before liveness takes over.
          startupProbe:
            httpGet: {path: /ping, port: 7878}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ,   value: "Europe/Vienna"}
            {{- with .Values.radarr.postgres }}
            {{- if .secretName }}
            # PostgreSQL instead of SQLite (Servarr env overrides for config.xml).
            - {name: RADARR__POSTGRES__HOST, valueFrom: {secretKeyRef: {name: {{ .secretName }}, key: host}}}
            - {name: RADARR__POSTGRES__PORT, valueFrom: {secretKeyRef: {name: {{ .secretName }}, key: port}}}
            - {name: RADARR__POSTGRES__USER, valueFrom: {secretKeyRef: {name: {{ .secretName }}, key: username}}}
            - {name: RADARR__POSTGRES__PASSWORD, valueFrom: {secretKeyRef: {name: {{ .secretName }}, key: password}}}
            - {name: RADARR__POSTGRES__MAINDB, value: {{ .mainDb | default "radarr-main" | quote }}}
            - {name: RADARR__POSTGRES__LOGDB, value: {{ .logDb | default "radarr-log" | quote }}}
            {{- end }}
            {{- end }}
          ports: [{containerPort: 7878}]
          volumeMounts:
            - {name: config, mountPath: /config}
            # The whole share once: moves from the download folders into the
            # library are a rename on the NFS server (instant) and hardlinks work.
            # (Separate subPath mounts made every move a full copy over NFS.)
            - {name: nfs, mountPath: /data}
          resources:
            {{- toYaml .Values.radarr.resources | nindent 12 }}
      volumes:
        - {name: config, persistentVolumeClaim: {claimName: {{ .Values.radarr.config.existingClaim | default "radarr-config-pvc" }}}}
        - name: nfs
          nfs:
            server: cp0.seifert.id
            path: /mnt/hdd_huge/
---
apiVersion: v1
kind: Service
metadata: {name: radarr}
spec:
  selector: {app: radarr}
  ports: [{port: 7878, targetPort: 7878, name: http}]
  type: ClusterIP
