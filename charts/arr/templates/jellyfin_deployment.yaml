# jellyfin_deployment.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: jellyfin-config-pvc}
spec:
  storageClassName: nfs-fast
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: jellyfin-cache-pvc}
spec:
  storageClassName: nfs-fast
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 6Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: jellyfin}
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels: {app: jellyfin}
  template:
    metadata:
      labels: {app: jellyfin}
    spec:
      {{- with .Values.jellyfin.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        supplementalGroups: [109, 44]
      {{- if .Values.jellyfin.migrateOnStart }}
      # Run database migrations (Jellyfin >= 12) before the server starts.
      # Init containers have no probes, so a long one-way migration can't be
      # killed halfway by the liveness probe. A no-op once migrated. (A
      # failed migration still exits 0; the server then retries it and
      # stays unready, see its log.)
      initContainers:
        - name: migrate
          image: {{ .Values.jellyfin.image }}
          imagePullPolicy: IfNotPresent
          args: ["--mode", "MigrateSystem"]
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: cache,  mountPath: /cache}
            - {name: media,  mountPath: /hdd_huge_media, readOnly: true}
      {{- end }}
      containers:
        - name: jellyfin
          image: {{ .Values.jellyfin.image }}
          imagePullPolicy: IfNotPresent
          readinessProbe:
            httpGet: {path: /health, port: 8096}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8096}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # Up to 5 min for the first start (migrations / loading)
          # before liveness takes over.
          startupProbe:
            httpGet: {path: /health, port: 8096}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          ports: [{containerPort: 8096}]
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: cache,  mountPath: /cache}
            - {name: media,  mountPath: /hdd_huge_media, readOnly: true}
          resources:
            {{- toYaml .Values.jellyfin.resources | nindent 12 }}
      volumes:
        - {name: config,  persistentVolumeClaim: {claimName: jellyfin-config-pvc}}
        - {name: cache,   persistentVolumeClaim: {claimName: jellyfin-cache-pvc}}
        - name: media
          nfs:
            server: cp0.seifert.id
            path: /mnt/hdd_huge/
            readOnly: true
---
apiVersion: v1
kind: Service
metadata: {name: jellyfin}
spec:
  selector: {app: jellyfin}
  ports: [{port: 8096, targetPort: 8096, name: http}]
  type: ClusterIP
