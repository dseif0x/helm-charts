# flaresolverr_deployment.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: flaresolverr}
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector: {matchLabels: {app: flaresolverr}}
  template:
    metadata: {labels: {app: flaresolverr}}
    spec:
      {{- with .Values.flaresolverr.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: flaresolverr
          image: {{ .Values.flaresolverr.image }}
          imagePullPolicy: IfNotPresent
          readinessProbe:
            httpGet: {path: /health, port: 8191}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8191}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # Up to 5 min for the first start (migrations / loading)
          # before liveness takes over.
          startupProbe:
            httpGet: {path: /health, port: 8191}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          env:
            - {name: LOG_LEVEL,  value: "info"}
            - {name: LOG_HTML,   value: "false"}
            - {name: CAPTCHA_SOLVER, value: "none"}
            - {name: TZ, value: "Europe/Vienna"}
          ports: [{containerPort: 8191}]
          resources:
            {{- toYaml .Values.flaresolverr.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: {name: flaresolverr}
spec:
  selector: {app: flaresolverr}
  ports: [{port: 8191, targetPort: 8191}]
  type: ClusterIP
