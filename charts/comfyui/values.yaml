domain: comfy.homelab.seifert.id
baseDomain: homelab.seifert.id
image: yanwk/comfyui-boot:cu128-slim-20251110

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    nvidia.com/gpu: 1

# Extra labels on the Deployment (e.g. sablier.enable / sablier.group).
deploymentLabels: {}

ingress:
  # Extra annotations, e.g. a Traefik middleware.
  annotations: {}
  # Additional hosts routed to the same service (no TLS entry is added for
  # them, e.g. public hosts that arrive through a Cloudflare tunnel).
  extraHosts: []

# Extra environment variables for the ComfyUI container.
extraEnv: []
#  - name: PIP_NO_CACHE_DIR
#    value: "1"

persistence:
  # The models volume (checkpoints, LoRAs, ...). A PVC's storage class and
  # access modes are immutable: to move an existing install, set a new name
  # (a new PVC is created, the old one is kept by helm.sh/resource-policy),
  # copy the data over, then delete the old PVC.
  models:
    # Default: <release>-models-pvc
    name: ""
    # Default: the cluster's default storage class. local-path pins the
    # volume to the node the pod first runs on (fast local disk, no NFS).
    storageClassName: ""
    accessModes:
      - ReadWriteMany
    size: 100Gi
