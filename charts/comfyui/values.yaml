domain: comfy.homelab.seifert.id
baseDomain: homelab.seifert.id
image: yanwk/comfyui-boot:cu128-slim-20251110

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    nvidia.com/gpu: 1

# Extra labels on the Deployment (e.g. sablier.enable / sablier.group).
deploymentLabels: {}

ingress:
  # Extra annotations, e.g. a Traefik middleware.
  annotations: {}
  # Additional hosts routed to the same service (no TLS entry is added for
  # them, e.g. public hosts that arrive through a Cloudflare tunnel).
  extraHosts: []

# Extra environment variables for the ComfyUI container.
extraEnv: []
#  - name: PIP_NO_CACHE_DIR
#    value: "1"
