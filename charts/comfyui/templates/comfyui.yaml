apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  {{- with .Values.deploymentLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  strategy:
    type: Recreate
  # No replicas: leave the count to whoever scales it (e.g. Sablier, which
  # scales it to zero when idle). Defaults to 1 on creation.
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: comfyui
          image: {{ .Values.image }}
          readinessProbe:
            httpGet: {path: /system_stats, port: 8188}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /system_stats, port: 8188}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # Up to 15 min for the first start (migrations / loading)
          # before liveness takes over.
          startupProbe:
            httpGet: {path: /system_stats, port: 8188}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          ports:
            - containerPort: 8188
          env:
            - name: SERVICEPORTAL_URL
              value: https://{{ .Values.domain }}
            - name: SERVICENAME_URL
              value: https://{{ .Values.domain }}
            - name: COMFYUI_URL
              value: https://{{ .Values.domain }}
          # The nvidia.com/gpu limit alone places the pod on visus: the API
          # server's ExtendedResourceToleration plugin adds the taint toleration
          # and visus's default runtime is nvidia.
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /root
              name: root-volume
            - mountPath: /root/ComfyUI/models
              name: models-volume
            - mountPath: /root/.cache/huggingface/hub
              name: hf-cache-volume
            - mountPath: /root/.cache/torch/hub
              name: torch-cache-volume
            - mountPath: /root/ComfyUI/input
              name: input-volume
            - mountPath: /root/ComfyUI/output
              name: output-volume
            - mountPath: /root/ComfyUI/user/default/workflows
              name: workflows-volume
      volumes:
        - name: root-volume
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-root-pvc
        - name: models-volume
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-models-pvc
        - name: hf-cache-volume
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-hf-cache-pvc
        - name: torch-cache-volume
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-torch-cache-pvc
        - name: input-volume
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-input-pvc
        - name: output-volume
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-output-pvc
        - name: workflows-volume
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-workflows-pvc
---
kind: Service
apiVersion: v1
metadata:
  name: comfyui-svc
spec:
  type: ClusterIP
  selector:
    app: comfyui
  ports:
  - name: http
    port: 8188
    protocol: TCP
    targetPort: 8188