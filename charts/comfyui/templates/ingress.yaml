apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # No secretName: Traefik serves its default certificate, the
  # *.homelab.seifert.id wildcard (flux-gitops-repo controllers/homelab-tls),
  # so the host name doesn't end up in the public CT logs.
  tls:
    - hosts:
        - {{ .Values.domain }}
  rules:
    {{- range (prepend .Values.ingress.extraHosts .Values.domain) }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: comfyui-svc
                port:
                  name: http
    {{- end }}
