apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hermes-agents.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes-agents.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hermes-agents.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "hermes-agents.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.auth.seed.enabled .Values.auth.seed.existingSecret }}
      initContainers:
        - name: seed-auth
          image: "{{ .Values.auth.seed.image.repository }}:{{ .Values.auth.seed.image.tag }}"
          imagePullPolicy: {{ .Values.auth.seed.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              for f in /seed/*; do
                [ -e "$f" ] || continue
                name=$(basename "$f")
                if [ -e "/opt/data/$name" ]; then
                  echo "skip /opt/data/$name (exists)"
                else
                  echo "seed /opt/data/$name"
                  cp "$f" "/opt/data/$name"
                fi
              done
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: auth-seed
              mountPath: /seed
              readOnly: true
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8642
              protocol: TCP
            {{- if .Values.dashboard.enabled }}
            - name: dashboard
              containerPort: {{ .Values.service.dashboardPort }}
              protocol: TCP
            {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /opt/data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "hermes-agents.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if and .Values.auth.seed.enabled .Values.auth.seed.existingSecret }}
        - name: auth-seed
          secret:
            secretName: {{ .Values.auth.seed.existingSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
